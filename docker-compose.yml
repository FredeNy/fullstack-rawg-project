# run without the seeder
# docker-compose up --scale seeder=0
services:
  rawg-fullstack-backend-2025-fall:
    container_name: rawg-fullstack-backend-2025-fall
    build:
      context: ./rawg-fullstack-backend-2025-fall
      dockerfile: Dockerfile
    volumes:
      - ./rawg-fullstack-backend-2025-fall:/app
    ports:
      - "5050:5000"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/rawgDatabase
      DB_TYPE: mysql
      SERVER_URL: http://localhost:5050
    depends_on:
      - mysql

  rawg-fullstack-2025-fall:
    container_name: rawg-fullstack-2025-fall
    build:
      context: ./rawg-fullstack-2025-fall
      dockerfile: Dockerfile
    volumes:
      - ./rawg-fullstack-2025-fall:/app
      - /app/node_modules # Prevents overwriting node_modules on the container
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5050
      CHOKIDAR_USEPOLLING: true # For file watching in Docker on some systems

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rawgDatabase
    ports:
      - "3307:3306"
    volumes:
      - mysql-data_rawg:/var/lib/mysql

  seeder:
    container_name: seeder
    build:
      context: ./seeder
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/rawgDatabase
      DB_TYPE: mysql
    volumes:
      - ./seeder:/app

volumes:
  mysql-data_rawg:
# if there are problems, remove it: 
# docker volume rm rawg-fullstack-2025-fall_mysql-data_rawg